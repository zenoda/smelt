# 前端开发样本类型定义
name: frontend_dev
description: "前端开发 — Vue3、ElementPlus、TypeScript、CSS、axios"

subcategories:
  - vue3_basics
  - vue3_components
  - element_plus
  - typescript_vue
  - axios_http
  - css_layout
  - state_management
  - frontend_engineering

# meta_prompt 模板
# 支持占位符: {seed_example}, {difficulty_instruction}, {subcategory},
#              {tool_definitions}, {extra_instruction}, {batch_size}
# 注意: 模板中的 JSON 花括号需要双写转义 {{ }}
meta_prompt: |
  你是一位训练数据生成专家。你的任务是生成高质量的前端开发训练样本。

  ## 要求

  请生成 {batch_size} 条独立的训练样本，以 JSON 数组格式返回：
  [
    {{"messages": [...]}},
    {{"messages": [...]}},
    ...
  ]
  每条样本之间要有足够的差异性（不同的问题场景、不同的技术细节）。

  ### 话题范围
  - Vue3 基础（响应式系统 ref/reactive、生命周期钩子、模板语法、计算属性与侦听器）
  - Vue3 组件开发（组件通信 props/emit/provide/inject、插槽 slot、动态组件、异步组件）
  - ElementPlus 组件库（表单验证、表格组件、对话框、消息提示、布局组件）
  - TypeScript + Vue3（类型标注、泛型组件、类型安全的 props/emit 定义、工具类型）
  - axios HTTP 请求（请求/响应拦截器、封装统一请求、错误处理、并发请求、取消请求）
  - CSS 布局（Flex 布局、Grid 布局、响应式设计、CSS 变量、BEM 命名、Scoped 样式）
  - 状态管理（Pinia store 定义与使用、持久化、模块化、组合式 store）
  - 前端工程化（Vite 配置、ESLint/Prettier、路由管理 vue-router、环境变量、打包优化）

  ### 格式要求
  1. 第一条消息必须是 system role，内容为：「你是一位资深前端开发工程师，精通 Vue3、TypeScript、ElementPlus、axios、CSS 等技术栈。请用简洁准确的语言回答问题，代码示例要完整可运行。」
  2. 后续交替 user 和 assistant 消息
  3. assistant 回复应包含：清晰的概念解释、完整可运行的代码示例（使用 Vue3 Composition API `<script setup lang="ts">`）、TypeScript 类型标注、ElementPlus 组件的正确用法
  4. 代码示例使用 ```vue、```typescript、```css 等代码块
  5. 使用中文
  {tool_definitions}

  ### 难度要求
  {difficulty_instruction}

  ### 子话题
  本次请聚焦于：{subcategory}
  {extra_instruction}

  ## 参考示例

  以下是同类别的一个参考样本，请生成【不同话题】但【同等质量】的新样本：

  {seed_example}

  ## 输出

  请直接输出一个合法的 JSON 数组，不要添加任何 markdown 代码块标记或其他说明文字。

# 子话题的详细指令（可选）
# key 为子话题名称，value 为补充说明文字
extra_instructions:
  vue3_basics: "重点关注响应式系统 ref/reactive 的区别与使用场景、生命周期钩子 onMounted/onUnmounted、模板语法 v-if/v-for/v-model、计算属性 computed 与侦听器 watch/watchEffect"
  vue3_components: "重点关注组件通信 defineProps/defineEmits/provide/inject、插槽 slot（默认插槽、具名插槽、作用域插槽）、动态组件 <component :is>、异步组件 defineAsyncComponent"
  element_plus: "重点关注 ElForm 表单验证规则、ElTable 表格自定义列与排序、ElDialog 对话框控制、ElMessage/ElNotification 消息提示、ElMenu/ElBreadcrumb 导航组件"
  typescript_vue: "重点关注 Vue3 + TypeScript 的类型标注最佳实践、泛型组件 defineComponent<T>、类型安全的 defineProps<{}>() 和 defineEmits<{}>()、Ref<T>/ComputedRef<T> 类型、工具类型 PropType"
  axios_http: "重点关注 axios 请求/响应拦截器封装、统一请求函数 useRequest、错误处理与重试机制、并发请求 Promise.all、取消请求 AbortController、token 自动刷新"
  css_layout: "重点关注 Flex 布局（主轴/交叉轴对齐、flex-grow/shrink/basis）、Grid 布局（grid-template 定义、响应式网格）、响应式设计媒体查询、CSS 变量 var()、BEM 命名规范、Vue Scoped 样式与 :deep() 穿透"
  state_management: "重点关注 Pinia store 的 Options API 与 Composition API 两种定义方式、storeToRefs 解构、store 持久化插件、模块化拆分、组合式 store 之间的相互引用"
  frontend_engineering: "重点关注 Vite 配置（代理、别名、环境变量）、ESLint + Prettier 统一代码风格、vue-router 路由守卫与懒加载、打包优化（代码分割、tree-shaking、gzip 压缩）、CI/CD 集成"
